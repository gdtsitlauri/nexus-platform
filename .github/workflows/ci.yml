name: build and test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build flex bison iverilog yosys libopenmpi-dev openmpi-bin llvm-dev clang
          llvm-config --version
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$(llvm-config --cmakedir)"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: ctest --test-dir build --output-on-failure -j2
      - name: Report failed tests
        if: failure()
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: |
          for name in $(cut -d: -f2 build/Testing/Temporary/LastTestsFailed.log); do
            detail=$(ctest --test-dir build -R "^${name}\$" --output-on-failure 2>&1 | grep -v '^\s*$' | tail -12 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=${name}::${detail}"
          done
      - name: LLVM pass (NEY709)
        if: always()
        run: ctest --test-dir build -R nexus_llvm_pass -V
